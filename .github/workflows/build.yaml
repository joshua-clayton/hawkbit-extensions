name: build
run-name: Build and Test ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-s3:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Test hawkbit-extension-artifact-repository-s3
        run: mvn verify --batch-mode -DsnapshotDependencyAllowed=true -pl hawkbit-extension-artifact-repository-s3 -am

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Test Results (hawkbit-extension-artifact-repository-s3)
          files: '**/target/surefire-reports/*.xml'

  test-azure:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Test hawkbit-extension-artifact-repository-azure
        run: mvn verify --batch-mode -DsnapshotDependencyAllowed=true -pl hawkbit-extension-artifact-repository-azure -am

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Test Results (hawkbit-extension-artifact-repository-azure)
          files: '**/target/surefire-reports/*.xml'

  test-gcs:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Test hawkbit-extension-artifact-repository-gcs
        run: mvn verify --batch-mode -DsnapshotDependencyAllowed=true -pl hawkbit-extension-artifact-repository-gcs -am

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Test Results (hawkbit-extension-artifact-repository-gcs)
          files: '**/target/surefire-reports/*.xml'

  test-mongo:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Test hawkbit-extension-artifact-repository-mongo
        run: mvn verify --batch-mode -DsnapshotDependencyAllowed=true -pl hawkbit-extension-artifact-repository-mongo -am

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Test Results (hawkbit-extension-artifact-repository-mongo)
          files: '**/target/surefire-reports/*.xml'

  license-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Check license headers
        run: mvn license:check --batch-mode -DsnapshotDependencyAllowed=true
